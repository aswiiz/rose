<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f0e8"><title>For my favorite person — For Pavithra ♡</title><link rel="stylesheet" href="style.css"></head>
<body><div class="ambient" aria-hidden="true"><span class="petal p1">✿</span><span class="petal p2">❀</span><span class="petal p3">✧</span><span class="petal p4">♡</span><span class="petal p5">✿</span></div>
<header class="topbar"><div class="brand">a little story <span>♡</span></div><div class="progress-wrap"><div class="progress"><span style="width:66.67%"></span></div><small>6 / 9 · Tiny gifts</small></div></header>
<main class="book"><section class="page" data-page="5">
      <div class="eyebrow">A few tiny gifts · tap to open</div>
      <h2>For my favorite person</h2>
      <p class="center subtle">Each little gift has a tiny message tucked inside.</p>
      <div class="gift-carousel" aria-live="polite">
        <button class="gift-step" id="giftPrev" aria-label="Previous gift">‹</button>

          <div class="gift-animation"><iframe id="giftPreview" src="https://giphy.com/embed/vxsoC27UotxBK" title="Kitty hug gift" loading="lazy" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
          <strong id="giftTitle">A kitty hug</strong>
          <p id="giftHint">A little hug, just for you.</p>
          <button class="primary gift-open" id="giftOpen">Open this gift ♡</button>
        </article>
        <button class="gift-step" id="giftNext" aria-label="Next gift">›</button>
      </div>
      <div class="gift-count" id="giftCount">Gift 1 of 5</div>
      <div class="gift-reveal" id="giftReveal" hidden>
        <div class="gif-frame reveal-gif"><iframe id="giftGif" title="Animated little gift" loading="lazy" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
        <p id="giftMessage"></p>
        <button class="text-button" id="closeGift">close this little gift ×</button>
      </div>
